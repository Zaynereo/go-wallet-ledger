name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ledger
          MYSQL_USER: ledger
          MYSQL_PASSWORD: ledger
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci.tgz https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/golangci.tgz
          sudo mv /tmp/golangci-lint-2.15.0-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          golangci-lint version

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        env:
          MYSQL_DSN: ledger:ledger@tcp(127.0.0.1:3306)/ledger?parseTime=true&charset=utf8mb4&loc=UTC
          REQUIRE_INTEGRATION: "1"
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t go-wallet-ledger:ci .
