# Local demo stack. Passwords below are development defaults, not production secrets.
# Bind addresses are localhost-only.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
      MYSQL_ROOT_PASSWORD: root
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ledger-mysql:/var/lib/mysql

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: ledger:ledger@tcp(mysql:3306)/ledger?parseTime=true&charset=utf8mb4&loc=UTC
      PUBLISHER: ${PUBLISHER:-log}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: ledger.events
      LOG_LEVEL: info
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_LEASE: 30s
      SHUTDOWN_TIMEOUT: 15s
      LOCK_WAIT_TIMEOUT: 10s
    ports:
      - "127.0.0.1:8080:8080"

  # Optional broker: docker compose --profile kafka up
  # Set PUBLISHER=kafka so the relay uses Redpanda instead of the log publisher.
  redpanda:
    image: redpandadata/redpanda:v26.2.5
    profiles: ["kafka"]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
    ports:
      - "127.0.0.1:19092:19092"

volumes:
  ledger-mysql:
